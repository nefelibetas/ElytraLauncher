[package]
name = "Elytra"
version = "1.7.6"
description = "A modern, lightweight Minecraft launcher built with Tauri and Rust, providing a great option for Linux and cross-platform users."
authors = ["BridgeFishDev"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/nefelibetas/ElytraLauncher"
homepage = "https://github.com/nefelibetas/ElytraLauncher"
readme = "../README.md"
keywords = ["minecraft", "launcher", "tauri", "modrinth", "curseforge"]
categories = ["games", "gui"]

# 显式默认 bin：`src/bin/gen_ts.rs` 让包内出现两个 bin（elytra / gen_ts），
# 而 tauri-cli 的 dev 只发 `cargo run --no-default-features`（不带 --bin），
# 缺 default-run 时 cargo 会以 "could not determine which binary to run" 失败。
default-run = "elytra"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "elytra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# 显式小写 bin 名：默认随 package 名（Elytra 大写）会与配置目录
# exe_dir()/Elytra（config_dir）在 dev 下撞名——cargo 产物文件 vs 配置目录
# 互删互炸（Is a directory / File exists）。小写 elytra 与配置目录区分。
name = "elytra"
path = "src/main.rs"

[[bin]]
# TS 类型生成工具，默认不构建：tauri-cli 会把包内所有 bin（含 src/bin/* 扫描结果）
# 当作要打进安装包的附加二进制，macOS bundler 逐个 copy 进 Contents/MacOS；
# 而 universal 构建只产出主二进制 → 「Failed to copy binary from .../gen_ts」打包失败。
# 用 required-features 让它进 tauri-cli 的 disabled_bins（tauri-cli rust.rs:939 + matches_src_bin，
# 上游有同名测试 get_binaries_ignores_src_bin_with_disabled_required_features）。
# 需要时：`cargo run --bin gen_ts --features gen-ts`
name = "gen_ts"
path = "src/bin/gen_ts.rs"
required-features = ["gen-ts"]

[features]
# 仅用于开启 TS 类型生成工具；应用自身不依赖任何 feature
gen-ts = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
elytra-domain = { git = "https://github.com/ElytraLauncher/elytra-core", tag = "v0.1.2" }
elytra-dto = { git = "https://github.com/ElytraLauncher/elytra-core", tag = "v0.1.2" }
elytra-map = { git = "https://github.com/ElytraLauncher/elytra-core", tag = "v0.1.2" }
elytra-seedmap = { git = "https://github.com/ElytraLauncher/elytra-core", tag = "v0.1.2" }
elytra-online = { git = "https://github.com/ElytraLauncher/elytra-core", tag = "v0.1.2" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 单实例：二次启动聚焦已有窗口并由第二实例自行退出。配置与任务快照均为整段读-改-写，
# 跨进程无锁，多开会互相覆盖
tauri-plugin-single-instance = "2"
# 系统通知：任务完成/失败、游戏崩溃（窗口后台时）
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "http2", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
url = "2"
log = "0.4"
base64 = "0.22"
parking_lot = "0.12"
tauri-plugin-clipboard-manager = "2.5.0"

[target.'cfg(unix)'.dependencies]
# 启动日志 dup2 重定向
libc = "0.2"

# macOS 系统钥匙串（Keychain Services）；security-framework 不重导出 core-foundation，需显式声明
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"
# Linux Secret Service（org.freedesktop.secrets：GNOME Keyring / KWallet kwalletd5）
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# 解压/安装流程单测用临时目录（仅测试，不进入产物）。
# 注：serde_json / tokio / parking_lot 无需在此重复声明——集成测试同样能使用
# [dependencies]（tokio 主依赖的 "full" 已覆盖 macros / rt-multi-thread）。
tempfile = "3"
# commands/version 的整合包导出测试读取 zip 条目
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "aes-crypto", "time"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
# 体积优先（Tauri 指南）：启动器无 CPU 密集热路径；"z" 比 "s" 更激进压体积
opt-level = "z"
# panic 保持默认 unwind：downloader/batch.rs 依赖 JoinError（worker panic 转任务错误），abort 会让 worker panic 直接终止进程
strip = true
