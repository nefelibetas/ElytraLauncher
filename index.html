<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <script src="/theme-init.js"></script>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                /* 窗口透明 + 圆角：底色只由骨架/应用容器提供，body 不铺满整窗。 */
                background: transparent;
            }
            #app {
                height: 100%;
                width: 100%;
                background: transparent;
            }

            /* ── 首帧骨架：按启动页实际结构铺 35% 左栏 + 右侧版本卡片 ── */
            #boot-splash {
                --bs-page: #f2f6f3;
                --bs-elevated: #ffffff;
                --bs-line: #e3e9e5;
                --bs-line-strong: #d5dfd9;
                --bs-brand: #059669;
                --bs-titlebar: linear-gradient(135deg, #059669, #10b981);
                --bs-active: rgba(5, 150, 105, 0.12);
                --bs-logo-bg: rgba(255, 255, 255, 0.95);
                --bs-logo-fg: var(--bs-brand);
                --bs-logo-border: transparent;
                --bs-logo-wing: #047857;
                --bs-launch: linear-gradient(135deg, rgba(5, 150, 105, 0.18), rgba(16, 185, 129, 0.1));
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border-radius: 8px;
                background: var(--bs-page);
                color: #1f2937;
                font-family: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
                box-sizing: border-box;
            }
            /* 深色首帧骨架：theme-init.js 先写 data-mode，系统偏好作为兜底 */
            html[data-mode="dark"] #boot-splash {
                --bs-page: #0d1511;
                --bs-elevated: #14201a;
                --bs-line: #26382f;
                --bs-line-strong: #375345;
                --bs-brand: #34d399;
                --bs-titlebar: linear-gradient(135deg, #047857, #34d399);
                --bs-active: rgba(52, 211, 153, 0.18);
                --bs-launch: linear-gradient(135deg, rgba(52, 211, 153, 0.22), rgba(16, 185, 129, 0.12));
                color: #e8f0eb;
            }
            @media (prefers-color-scheme: dark) {
                html:not([data-mode="light"]) #boot-splash {
                    --bs-page: #0d1511;
                    --bs-elevated: #14201a;
                    --bs-line: #26382f;
                    --bs-line-strong: #375345;
                    --bs-brand: #34d399;
                    --bs-titlebar: linear-gradient(135deg, #047857, #34d399);
                    --bs-active: rgba(52, 211, 153, 0.18);
                    --bs-launch: linear-gradient(135deg, rgba(52, 211, 153, 0.22), rgba(16, 185, 129, 0.12));
                    --bs-logo-bg: rgba(4, 10, 7, 0.34);
                    --bs-logo-fg: #f8faf9;
                    --bs-logo-border: rgba(255, 255, 255, 0.16);
                    --bs-logo-wing: #6ee7b7;
                    color: #e8f0eb;
                }
            }
            /* 应用首帧已绘制后再加这个类：整块骨架淡出，露出下方真实页面。 */
            #boot-splash.bs-hide {
                animation: none;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.18s ease;
            }
            #boot-splash *,
            #boot-splash *::before,
            #boot-splash *::after {
                box-sizing: border-box;
            }

            .bs-titlebar {
                flex: 0 0 48px;
                height: 48px;
                display: flex;
                align-items: center;
                gap: 18px;
                padding: 0 12px;
                background: var(--bs-titlebar);
                box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            }
            .bs-brand {
                display: flex;
                align-items: center;
                gap: 6px;
                height: 30px;
                padding: 0 10px;
                border-radius: 8px;
                background: var(--bs-logo-bg);
                color: var(--bs-logo-fg);
                box-shadow: inset 0 0 0 1px var(--bs-logo-border);
                font-size: 18px;
                font-weight: 800;
                letter-spacing: -0.5px;
            }
            .bs-brand svg {
                width: 15px;
                height: 15px;
                color: var(--bs-logo-wing);
            }
            .bs-tabs {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }
            .bs-tab {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                border-radius: 8px;
                background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.1) 25%,
                    rgba(255, 255, 255, 0.26) 37%,
                    rgba(255, 255, 255, 0.1) 63%
                );
                background-size: 300% 100%;
                animation: bs-shimmer 2s ease-in-out infinite;
            }
            .bs-tab.active {
                background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.2) 25%,
                    rgba(255, 255, 255, 0.38) 37%,
                    rgba(255, 255, 255, 0.2) 63%
                );
                background-size: 300% 100%;
            }
            .bs-tab-icon {
                width: 14px;
                height: 14px;
                border-radius: 4px;
                background: rgba(255, 255, 255, 0.55);
            }
            .bs-tab-label {
                width: 44px;
                height: 8px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.38);
            }
            .bs-tab.active .bs-tab-label {
                background: rgba(255, 255, 255, 0.65);
            }
            .bs-window {
                display: flex;
                gap: 6px;
            }
            .bs-win {
                width: 26px;
                height: 22px;
                border-radius: 6px;
                background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.08) 25%,
                    rgba(255, 255, 255, 0.2) 37%,
                    rgba(255, 255, 255, 0.08) 63%
                );
                background-size: 300% 100%;
                animation: bs-shimmer 2s ease-in-out infinite;
            }

            .bs-main {
                flex: 1;
                min-height: 0;
                display: flex;
            }

            /* 左栏：账号切换 + 头像 / 用户名 + 启动按钮 */
            .bs-left {
                flex: 0 0 35%;
                min-width: 280px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                padding: 20px 24px;
                background: var(--bs-elevated);
                border-right: 1px solid var(--bs-line);
            }
            .bs-auth {
                display: flex;
                gap: 4px;
            }
            .bs-auth-btn {
                flex: 1;
                height: 30px;
                border-radius: 6px;
            }
            .bs-auth-btn.active {
                background: var(--bs-active);
            }
            .bs-user {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
            }
            .bs-avatar {
                width: 96px;
                height: 96px;
                border-radius: 10px;
            }
            .bs-name {
                width: 110px;
                height: 14px;
                border-radius: 999px;
            }
            .bs-launch {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .bs-launch-btn {
                position: relative;
                overflow: hidden;
                height: 78px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                background: var(--bs-launch);
            }
            .bs-launch-btn::after {
                content: "";
                position: absolute;
                inset: 0;
                transform: translateX(-120%);
                background: linear-gradient(
                    100deg,
                    transparent 32%,
                    rgba(255, 255, 255, 0.45) 50%,
                    transparent 68%
                );
                animation: bs-launch-sweep 2.2s ease-in-out infinite;
            }
            .bs-launch-line {
                width: 92px;
                height: 10px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.72);
            }
            .bs-launch-line.sm {
                width: 56px;
                height: 8px;
                background: rgba(255, 255, 255, 0.5);
            }
            .bs-secondary {
                height: 34px;
                border-radius: 8px;
            }

            /* 右栏：版本卡片骨架 */
            .bs-right {
                flex: 1;
                min-width: 0;
                padding: 16px;
                background: var(--bs-page);
            }
            .bs-card {
                height: 100%;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border: 1px solid var(--bs-line);
                border-radius: 16px;
                background: var(--bs-elevated);
                box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            }
            .bs-card-hd {
                flex: none;
                height: 66px;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 16px;
                border-bottom: 1px solid var(--bs-line);
            }
            .bs-card-icon {
                width: 36px;
                height: 36px;
                border-radius: 8px;
            }
            .bs-card-title {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 7px;
            }
            .bs-card-actions {
                display: flex;
                gap: 6px;
            }
            .bs-mini {
                width: 26px;
                height: 26px;
                border-radius: 6px;
            }
            .bs-card-main {
                flex: 1;
                min-height: 0;
                display: flex;
            }
            .bs-side {
                flex: 0 0 44px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 10px 0;
                border-right: 1px solid var(--bs-line);
                background: var(--bs-elevated);
            }
            .bs-side-dot {
                width: 30px;
                height: 30px;
                border-radius: 8px;
            }
            .bs-side-dot.active {
                background: var(--bs-active);
            }
            .bs-side-spacer {
                flex: 1;
            }
            .bs-list {
                flex: 1;
                min-width: 0;
                padding: 6px 10px 10px;
                overflow: hidden;
            }
            .bs-row {
                height: 68px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 4px;
                border-bottom: 1px solid rgba(223, 229, 225, 0.7);
            }
            .bs-row:last-child {
                border-bottom: none;
            }
            .bs-row-icon {
                width: 36px;
                height: 36px;
                border-radius: 6px;
                flex: none;
            }
            .bs-row-lines {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 7px;
            }
            .bs-row-action {
                width: 28px;
                height: 28px;
                border-radius: 6px;
                flex: none;
            }

            /* 骨架条 + 流光 */
            .bs-sk {
                position: relative;
                overflow: hidden;
                background: linear-gradient(
                    90deg,
                    var(--bs-line) 25%,
                    #f0f5f1 37%,
                    var(--bs-line) 63%
                );
                background-size: 300% 100%;
                animation: bs-shimmer 1.6s ease-in-out infinite;
            }
            .bs-sk.active {
                background: linear-gradient(
                    90deg,
                    rgba(5, 150, 105, 0.12) 25%,
                    rgba(5, 150, 105, 0.22) 37%,
                    rgba(5, 150, 105, 0.12) 63%
                );
                background-size: 300% 100%;
            }
            .bs-line {
                display: block;
                height: 10px;
                border-radius: 999px;
            }
            .bs-line.sm {
                height: 8px;
            }
            .bs-w60 {
                width: 60%;
            }
            .bs-w45 {
                width: 45%;
            }
            .bs-w30 {
                width: 30%;
            }
            @keyframes bs-shimmer {
                0% {
                    background-position: 100% 0;
                }
                100% {
                    background-position: -100% 0;
                }
            }
            @keyframes bs-launch-sweep {
                0% {
                    transform: translateX(-120%);
                }
                60%,
                100% {
                    transform: translateX(120%);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .bs-sk,
                .bs-tab,
                .bs-win,
                .bs-launch-btn::after {
                    animation: none;
                }
                #boot-splash.bs-hide {
                    transition: none;
                }
            }
        </style>
    </head>

    <body>
        <div id="boot-splash" aria-hidden="true">
                <header class="bs-titlebar">
                    <div class="bs-brand">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
                            <line x1="16" y1="8" x2="2" y2="22"></line>
                            <line x1="17.5" y1="15" x2="9" y2="15"></line>
                        </svg>
                        <span>Elytra</span>
                    </div>
                    <div class="bs-tabs">
                        <div class="bs-tab active">
                            <span class="bs-tab-icon"></span>
                            <span class="bs-tab-label"></span>
                        </div>
                        <div class="bs-tab">
                            <span class="bs-tab-icon"></span>
                            <span class="bs-tab-label"></span>
                        </div>
                        <div class="bs-tab">
                            <span class="bs-tab-icon"></span>
                            <span class="bs-tab-label"></span>
                        </div>
                        <div class="bs-tab">
                            <span class="bs-tab-icon"></span>
                            <span class="bs-tab-label"></span>
                        </div>
                    </div>
                    <div class="bs-window">
                        <span class="bs-win"></span>
                        <span class="bs-win"></span>
                    </div>
                </header>

                <div class="bs-main">
                    <div class="bs-left">
                        <div class="bs-auth">
                            <span class="bs-sk bs-auth-btn active"></span>
                            <span class="bs-sk bs-auth-btn"></span>
                            <span class="bs-sk bs-auth-btn"></span>
                        </div>
                        <div class="bs-user">
                            <span class="bs-sk bs-avatar"></span>
                            <span class="bs-sk bs-name"></span>
                        </div>
                        <div class="bs-launch">
                            <div class="bs-launch-btn">
                                <span class="bs-launch-line"></span>
                                <span class="bs-launch-line sm"></span>
                            </div>
                            <span class="bs-sk bs-secondary"></span>
                        </div>
                    </div>

                    <div class="bs-right">
                        <div class="bs-card">
                            <div class="bs-card-hd">
                                <span class="bs-sk bs-card-icon"></span>
                                <div class="bs-card-title">
                                    <span class="bs-sk bs-line bs-w45"></span>
                                    <span class="bs-sk bs-line sm bs-w30"></span>
                                </div>
                                <div class="bs-card-actions">
                                    <span class="bs-sk bs-mini"></span>
                                    <span class="bs-sk bs-mini"></span>
                                    <span class="bs-sk bs-mini"></span>
                                </div>
                            </div>
                            <div class="bs-card-main">
                                <div class="bs-side">
                                    <span class="bs-sk bs-side-dot active"></span>
                                    <span class="bs-sk bs-side-dot"></span>
                                    <span class="bs-sk bs-side-dot"></span>
                                    <span class="bs-sk bs-side-dot"></span>
                                    <span class="bs-sk bs-side-dot"></span>
                                    <span class="bs-side-spacer"></span>
                                    <span class="bs-sk bs-side-dot"></span>
                                </div>
                                <div class="bs-list">
                                    <div class="bs-row">
                                        <span class="bs-sk bs-row-icon"></span>
                                        <div class="bs-row-lines">
                                            <span class="bs-sk bs-line bs-w60"></span>
                                            <span class="bs-sk bs-line sm bs-w30"></span>
                                        </div>
                                        <span class="bs-sk bs-row-action"></span>
                                    </div>
                                    <div class="bs-row">
                                        <span class="bs-sk bs-row-icon"></span>
                                        <div class="bs-row-lines">
                                            <span class="bs-sk bs-line bs-w45"></span>
                                            <span class="bs-sk bs-line sm bs-w30"></span>
                                        </div>
                                        <span class="bs-sk bs-row-action"></span>
                                    </div>
                                    <div class="bs-row">
                                        <span class="bs-sk bs-row-icon"></span>
                                        <div class="bs-row-lines">
                                            <span class="bs-sk bs-line bs-w60"></span>
                                            <span class="bs-sk bs-line sm bs-w30"></span>
                                        </div>
                                        <span class="bs-sk bs-row-action"></span>
                                    </div>
                                    <div class="bs-row">
                                        <span class="bs-sk bs-row-icon"></span>
                                        <div class="bs-row-lines">
                                            <span class="bs-sk bs-line bs-w45"></span>
                                            <span class="bs-sk bs-line sm bs-w30"></span>
                                        </div>
                                        <span class="bs-sk bs-row-action"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
